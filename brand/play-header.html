<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kalmarium Play developer header</title>
<style>
  :root{--paper:#F4EFE6;--surface:#FBF8F2;--ink:#14181A;--muted:#5A5F5C;--line:#D8D0C2;--brand:#0F5257;--amber:#F2B134;--amber-ink:#B5730A}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:4096px;height:2304px;overflow:hidden;background:var(--paper)}
  body{position:relative;font-family:system-ui,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
  .mono{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;text-transform:uppercase;letter-spacing:.2em}
  /* paper tone: very soft warm vignette, no purple */
  .tone{position:absolute;inset:0;background:radial-gradient(ellipse 60% 55% at 50% 48%,#F8F4EC 0%,#F4EFE6 55%,#ECE5D6 100%)}
  .frame{position:absolute;inset:96px;border:3px solid var(--line)}
  .corner{position:absolute;font-size:34px;color:var(--muted)}
  .c1{left:150px;top:140px}.c2{right:150px;top:140px}.c3{left:150px;bottom:140px}.c4{right:150px;bottom:140px}
  /* centre column: stays inside the centre 60% x 50% */
  .centre{position:absolute;left:819px;width:2458px;top:640px;height:1088px;text-align:center}
  .kicker{position:absolute;left:0;right:0;top:34px;font-size:40px;color:var(--brand)}
  .word{position:absolute;left:0;right:0;top:118px;font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;font-weight:700;font-size:300px;line-height:1;color:var(--brand);letter-spacing:-.01em}
  .rule{position:absolute;left:0;right:0;top:480px;height:3px;background:var(--line)}
  .rule i{position:absolute;left:50%;top:-14px;width:30px;height:30px;margin-left:-15px;border-radius:50%;background:var(--amber)}
  .row{position:absolute;left:0;right:0;top:580px;display:flex;justify-content:space-between}
  .item{width:230px;text-align:center}
  .item img{display:block;width:230px;height:230px;border-radius:52px;box-shadow:0 18px 36px rgba(20,24,26,.22),0 2px 0 rgba(255,255,255,.5) inset}
  .item span{display:block;margin-top:34px;font-size:34px;color:var(--amber-ink);letter-spacing:.16em}
  .url{position:absolute;left:0;right:0;top:1030px;font-size:38px;color:var(--muted)}
  /* phones: outside the safe area, decorative */
  .phone{position:absolute;width:600px;height:1033px;padding:22px;border-radius:84px;background:#14181A;box-shadow:0 50px 90px rgba(20,24,26,.30),0 0 0 4px #2A383D inset}
  .phone img{display:block;width:556px;height:989px;object-fit:cover;object-position:top;border-radius:64px}
  .p1{left:160px;top:630px}
  .p2{right:160px;top:630px}
</style>
</head>
<body>
  <div class="tone"></div>
  <div class="frame"></div>
  <div class="corner mono c1">Kalmarium Services B.V.</div>
  <div class="corner mono c2">Almere, Netherlands</div>
  <div class="corner mono c3">Nine Android apps</div>
  <div class="corner mono c4">Google Play</div>

  <div class="phone p1"><img src="src/ph-1.webp" alt=""></div>
  <div class="phone p2"><img src="src/ph-3.webp" alt=""></div>

  <div class="centre">
    <div class="kicker mono">Android apps and games</div>
    <div class="word">Kalmarium</div>
    <div class="rule"><i></i></div>
    <div class="row">
      <div class="item"><img src="src/icon-knowdrop.webp" alt=""><span class="mono">01</span></div>
      <div class="item"><img src="src/icon-mahjong365.webp" alt=""><span class="mono">02</span></div>
      <div class="item"><img src="src/icon-tankageddon.webp" alt=""><span class="mono">03</span></div>
      <div class="item"><img src="src/icon-lingua-pairs.webp" alt=""><span class="mono">04</span></div>
      <div class="item"><img src="src/icon-bilingua.webp" alt=""><span class="mono">05</span></div>
      <div class="item"><img src="src/icon-prep4cert.webp" alt=""><span class="mono">06</span></div>
      <div class="item"><img src="src/icon-network-troubleshooter.webp" alt=""><span class="mono">07</span></div>
      <div class="item"><img src="src/icon-lazy-intercom.webp" alt=""><span class="mono">08</span></div>
      <div class="item"><img src="src/icon-crack-a-fold.webp" alt=""><span class="mono">09</span></div>
    </div>
    <div class="url mono">apps.kalmarium.com</div>
  </div>
</body>
</html>
